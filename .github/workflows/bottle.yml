# Build Homebrew bottles for a released icofon version.
#
# A bottle is a precompiled build, so `brew install` unpacks it instead of
# compiling from source and pulling in the Rust toolchain. icofon has no
# runtime dependencies beyond the OS itself, so a bottle isn't tied to a
# specific macOS version the way most compiled formulae are - only to CPU
# architecture. One bottle per architecture is enough; Homebrew falls back to
# an older-OS bottle of the same architecture on newer macOS releases, so
# building on the oldest supported OS per architecture maximizes how far that
# fallback reaches. Anything not covered still falls back to a source build.
#
# This lives in the tap, and the bottles are hosted on the tap's own releases,
# so both the upload and the formula commit are same-repository writes that the
# built-in GITHUB_TOKEN covers. There is no personal access token anywhere.
#
# Fully self-contained: pass the released icofon version and this workflow
# bumps Formula/icofon.rb's url/sha256 itself before building, so there's
# nothing to prepare in the tap beforehand.

name: Bottle

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released icofon version to bottle, without the leading v"
        required: true
        type: string

permissions:
  contents: write

env:
  FORMULA: jwo1f/tap/icofon

jobs:
  prepare:
    name: Bump formula to ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point the formula at the release archive
        run: |
          set -euo pipefail
          url="https://github.com/JWo1F/icofon/archive/refs/tags/v${{ inputs.version }}.tar.gz"
          curl -fsSL -o icofon-src.tar.gz "$url"
          sha=$(sha256sum icofon-src.tar.gz | cut -d' ' -f1)
          rm icofon-src.tar.gz

          sed -i -E "s|^  url \".*\"\$|  url \"$url\"|" Formula/icofon.rb
          sed -i -E "s|^  sha256 \"[0-9a-f]{64}\"\$|  sha256 \"$sha\"|" Formula/icofon.rb

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/icofon.rb
          if git diff --cached --quiet; then
            echo "Formula already at ${{ inputs.version }}, nothing to bump."
          else
            git commit -m "v${{ inputs.version }}"
            git push origin HEAD:main
          fi

  build:
    name: ${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest arm64 runner and the last available Intel one - see the
        # header comment for why one OS version per architecture is enough.
        os: [macos-14, macos-15-intel]
    steps:
      - name: Tap
        # A third-party tap has to be trusted before its formulae will load.
        run: |
          brew tap JWo1F/tap
          brew trust JWo1F/tap

      - name: Build the bottle
        run: |
          set -euo pipefail
          brew install --build-bottle "$FORMULA"
          brew bottle --json --no-rebuild \
            --root-url="https://github.com/JWo1F/homebrew-tap/releases/download/icofon-${{ inputs.version }}" \
            "$FORMULA"
          # Homebrew writes `name--version` locally but downloads `name-version`.
          for f in *--*.bottle.tar.gz; do mv "$f" "${f/--/-}"; done
          ls -la ./*.bottle.*

      - name: Run the formula's test against the build
        run: brew test "$FORMULA"

      - name: Check the bottle carries a working binary
        run: |
          set -euo pipefail
          tar -xzf ./*.bottle.tar.gz
          ./icofon/${{ inputs.version }}/bin/icofon --version

      - uses: actions/upload-artifact@v4
        with:
          name: bottle-${{ matrix.os }}
          path: |
            *.bottle.tar.gz
            *.bottle.json
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bottles
          merge-multiple: true

      - name: Attach the bottles to this tap's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: icofon-${{ inputs.version }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          gh release view "$TAG" --repo "$repo" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$repo" \
                 --title "icofon ${{ inputs.version }} bottles" \
                 --notes "Precompiled builds of icofon ${{ inputs.version }}, poured by \`brew install jwo1f/tap/icofon\`."
          gh release upload "$TAG" bottles/*.bottle.tar.gz --clobber --repo "$repo"

      - name: Write the bottle block into the formula and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          brew tap JWo1F/tap
          brew trust JWo1F/tap
          brew bottle --merge --write --no-commit bottles/*.bottle.json

          cd "$(brew --repository JWo1F/tap)"
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git commit -am "icofon ${{ inputs.version }}: bottles"
          git push origin HEAD:main
